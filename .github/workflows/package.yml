name: Auto Package Texture Pack

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 複製專案程式碼
        uses: actions/checkout@v4

      - name: 打包成ZIP
        run: |
          zip -r ButterWorldTexturePack.zip assets pack.mcmeta pack.png -x "*.git*" ".github/*"

      - name: 發布至 GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ButterWorldTexturePack.zip
          tag_name: automated-${{ github.run_number }}
          name: "ButterWorld 材質包 #${{ github.run_number }}"
          body: "自動發布的版本。"
          latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}